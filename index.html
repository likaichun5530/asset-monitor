<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f9fafb" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="有数" />
    <script>
      // 在页面渲染前同步设置暗夜模式，避免闪烁
      (function() {
        try {
          var isNativeApp = location.protocol === 'https:' && location.hostname === 'localhost'
          if (isNativeApp) document.documentElement.classList.add('native-app')
          var t = localStorage.getItem('youshu-theme')
          var isDark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var darkBackground = isNativeApp ? '#0d1017' : '#21262f'
          document.querySelector('meta[name="theme-color"]').content = isDark ? darkBackground : '#f9fafb'
          document.querySelector('meta[name="color-scheme"]').content = isDark ? 'dark' : 'light'
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
          if (isDark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.backgroundColor = darkBackground
          }
        } catch(e) {}
      })()
    </script>
    <title>有数</title>
  </head>
  <body>
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      html,body,#root{height:100%;min-height:100%;background:#fff}
      #app-boot-shell{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
      #app-boot-shell img{width:min(58vw,280px);height:auto;object-fit:contain}
      #app-boot-shell .boot-logo-dark{display:none}
      html.dark,html.dark body,html.dark #root,html.dark #app-boot-shell{background:#000}
      html.dark #app-boot-shell .boot-logo-light{display:none}
      html.dark #app-boot-shell .boot-logo-dark{display:block}
      html.native-app #app-boot-shell img{display:none!important}
      html.native-app.dark,html.native-app.dark body,html.native-app.dark #root,html.native-app.dark #app-boot-shell{background:#0d1017}
    </style>
    <div id="root">
      <div id="app-boot-shell" aria-hidden="true">
        <img src="/Transparent-Chinese.png" alt="" class="boot-logo-light" />
        <img src="/white-Chinese.png" alt="" class="boot-logo-dark" />
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
