<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="有数" />
    <script>
      // 在页面渲染前同步设置暗夜模式，避免闪烁
      (function() {
        try {
          var t = localStorage.getItem('youshu-theme')
          var isDark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.querySelector('meta[name="theme-color"]').content = isDark ? '#1f2937' : '#ffffff'
          document.querySelector('meta[name="color-scheme"]').content = isDark ? 'dark' : 'light'
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
          if (isDark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.backgroundColor = '#111827'
          }
        } catch(e) {}
      })()
    </script>
    <title>有数</title>
  </head>
  <body>
    <style>
      *{margin:0;padding:0}
      #app-boot-shell{box-sizing:border-box;min-height:100%;background:#f9fafb;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      #app-boot-shell>div{display:flex;height:48px;align-items:center;padding:0 16px;font-size:24px;font-weight:700}
      html.dark #app-boot-shell{background:#111827;color:#e5e7eb}
      @media(min-width:640px){#app-boot-shell>div{display:none}}
    </style>
    <div id="root"><div id="app-boot-shell" aria-hidden="true"><div>总览</div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
