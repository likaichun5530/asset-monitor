<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="有数" />
    <script>
      // 在页面渲染前同步设置暗夜模式，避免闪烁
      (function() {
        try {
          var t = localStorage.getItem('youshu-theme')
          var isDark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var themeMeta = document.querySelector('meta[name="theme-color"]')
          if (themeMeta) themeMeta.content = isDark ? '#1f2937' : '#ffffff'
          document.querySelector('link[rel="manifest"]').setAttribute('href', isDark ? '/manifest-dark.webmanifest' : '/manifest.webmanifest')
          document.querySelector('meta[name="color-scheme"]').content = isDark ? 'dark' : 'light'
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
          if (isDark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.backgroundColor = '#111827'
          }
        } catch(e) {}
      })()
    </script>
    <title>有数</title>
  </head>
  <body>
    <style>*{margin:0;padding:0}</style>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
