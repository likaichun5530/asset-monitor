<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 深色背景渐变 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1121"/>
      <stop offset="100%" stop-color="#1A233A"/>
    </linearGradient>
    <!-- 金色渐变 -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <!-- 蓝色渐变 -->
    <linearGradient id="blue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <!-- 青绿渐变 -->
    <linearGradient id="teal" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <!-- 整体阴影 -->
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <!-- 金色光晕 -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 深色圆角方形背景 -->
  <rect width="512" height="512" rx="118" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- 内部浅色边框 -->
  <rect x="1" y="1" width="510" height="510" rx="117" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>

  <!-- 中心金色核心圆点 -->
  <circle cx="256" cy="256" r="28" fill="url(#gold)" filter="url(#glow)"/>

  <!-- 金色外环 -->
  <circle cx="256" cy="256" r="44" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.30"/>

  <!-- 蓝色渐变弧（左上） -->
  <path d="M 154 332 A 120 120 0 0 1 256 136"
        fill="none" stroke="url(#blue)" stroke-width="10" stroke-linecap="round"/>

  <!-- 青色渐变弧（右下） -->
  <path d="M 256 376 A 120 120 0 0 1 136 256"
        fill="none" stroke="url(#teal)" stroke-width="8" stroke-linecap="round"/>

  <!-- 蓝色弧端点圆 -->
  <circle cx="155" cy="330" r="6" fill="url(#blue)"/>
  <circle cx="256" cy="138" r="5" fill="url(#blue)"/>

  <!-- 青色弧端点圆 -->
  <circle cx="138" cy="256" r="5" fill="url(#teal)"/>
  <circle cx="256" cy="374" r="4" fill="url(#teal)"/>

  <!-- 装饰小星点 -->
  <circle cx="370" cy="145" r="3.5" fill="#FFFFFF" opacity="0.15"/>
  <circle cx="390" cy="355" r="3" fill="#FFFFFF" opacity="0.10"/>
  <circle cx="140" cy="140" r="2.5" fill="#FFFFFF" opacity="0.10"/>

</svg>