<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 蓝色渐变 -->
    <linearGradient id="blue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <!-- 青绿渐变 -->
    <linearGradient id="green" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>

  <!-- 白色圆角方形背景 -->
  <rect width="512" height="512" rx="112" fill="#FFFFFF"/>

  <!-- 蓝色渐变 270° 圆弧 -->
  <path d="M 150 355 A 145 145 0 1 1 362 355"
        fill="none" stroke="url(#blue)" stroke-width="28" stroke-linecap="round"/>

  <!-- 蓝色折线箭头 左下 → 右上 -->
  <polyline points="120,400 230,280 340,295 430,170"
            fill="none" stroke="url(#blue)" stroke-width="24"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 箭头头部 -->
  <polyline points="400,200 430,170 412,152"
            fill="none" stroke="url(#blue)" stroke-width="22"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 三根青绿柱状图 -->
  <rect x="206" y="370" width="28" height="36" rx="6" fill="url(#green)"/>
  <rect x="246" y="350" width="28" height="56" rx="6" fill="url(#green)"/>
  <rect x="286" y="328" width="28" height="78" rx="6" fill="url(#green)"/>

</svg>