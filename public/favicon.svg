<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0F0F1A"/>

  <g filter="url(#softShadow)">
    <circle cx="256" cy="256" r="175" fill="none" stroke="url(#arcGrad)" stroke-width="3" stroke-dasharray="8 20" opacity="0.25"/>
    <circle cx="256" cy="256" r="155" fill="none" stroke="url(#arcGrad)" stroke-width="2" opacity="0.35"/>
    <path d="M 140 256 A 116 116 0 0 1 256 140" fill="none" stroke="url(#arcGrad)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M 256 372 A 116 116 0 0 1 140 256" fill="none" stroke="url(#arcGrad)" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
    <circle cx="256" cy="256" r="32" fill="url(#goldGrad)" filter="url(#glow)"/>
    <circle cx="256" cy="256" r="44" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.25"/>
    <circle cx="256" cy="140" r="5" fill="url(#arcGrad)" opacity="0.8"/>
    <circle cx="372" cy="256" r="4" fill="url(#arcGrad)" opacity="0.5"/>
    <circle cx="256" cy="372" r="3" fill="url(#arcGrad)" opacity="0.3"/>
    <circle cx="140" cy="256" r="3" fill="url(#arcGrad)" opacity="0.3"/>
    <line x1="256" y1="140" x2="256" y2="212" stroke="url(#arcGrad)" stroke-width="1.5" opacity="0.3"/>
    <line x1="372" y1="256" x2="312" y2="256" stroke="url(#arcGrad)" stroke-width="1.5" opacity="0.2"/>
  </g>
</svg>
